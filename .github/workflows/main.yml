name: Build LSFG-Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install full Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platform-tools" "platforms;android-34" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH" >> $GITHUB_ENV

      - name: 给 gradlew 加执行权限
        run: chmod +x LSFG-Android-Application/gradlew

      - name: 直接跑 gradlew assembleDebug（跳过签名校验，强制构建）
        working-directory: LSFG-Android-Application
        run: ./gradlew assembleDebug -Pandroid.injected.signing.store.file= -Pandroid.injected.signing.store.password= -Pandroid.injected.signing.key.alias= -Pandroid.injected.signing.key.password= --no-configuration-cache

      - name: 上传构建好的 APK
        uses: actions/upload-artifact@v4
        with:
          name: LSFG-Android-APK
          path: LSFG-Android-Application/app/build/outputs/apk/debug/*.apk
