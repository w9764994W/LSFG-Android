name: Build LSFG-Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK & Build Tools
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          ndk: 26.1.10909125
          cmake: 3.22.1

      - name: 给 gradlew 加执行权限
        run: chmod +x LSFG-Android-Application/gradlew

      - name: 构建 Debug APK
        working-directory: LSFG-Android-Application
        run: ./gradlew assembleDebug --no-configuration-cache

      - name: 上传构建好的 APK
        uses: actions/upload-artifact@v4
        with:
          name: LSFG-Android-APK
          path: LSFG-Android-Application/app/build/outputs/apk/debug/*.apk
